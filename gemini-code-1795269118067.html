<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Taberna Ibérica — Carta Digital Táctil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #faf7f2;
      --bg-surface: #ffffff;
      --bg-soft: #f3ede2;
      --text-main: #241918;
      --text-muted: #5e4c49;
      --accent-burgundy: #7c1d27;
      --accent-burgundy-dark: #5e131b;
      --accent-burgundy-soft: rgba(124, 29, 39, 0.08);
      --accent-gold: #b88b3a;
      --accent-gold-soft: rgba(184, 139, 58, 0.14);
      --border-subtle: rgba(36, 25, 24, 0.11);
      --border-gold: rgba(184, 139, 58, 0.35);
      --shadow-card: 0 10px 28px rgba(36, 25, 24, 0.06);
      --shadow-elevated: 0 18px 42px rgba(36, 25, 24, 0.14);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 112px;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(184, 139, 58, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(124, 29, 39, 0.06) 0%, transparent 42%);
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 18px 36px;
    }

    /* Header */
    .brand-header {
      text-align: center;
      padding: 14px 16px 22px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .brand-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .brand-eyebrow::before,
    .brand-eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--accent-gold);
      opacity: 0.65;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4.4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent-burgundy);
    }

    .brand-subtitle {
      margin: 8px auto 0;
      max-width: 620px;
      font-size: 14.5px;
      color: var(--text-muted);
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 18px 2px 14px;
      margin-bottom: 6px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(250, 247, 242, 0.96) 78%, rgba(250, 247, 242, 0));
      backdrop-filter: blur(8px);
    }

    .tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1 0 auto;
      min-height: 52px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 10px rgba(36, 25, 24, 0.04);
      user-select: none;
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn.active {
      background: var(--accent-burgundy);
      border-color: var(--accent-burgundy);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(124, 29, 39, 0.24);
    }

    .tab-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-gold-soft);
      color: var(--accent-burgundy);
    }

    .tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Section Header */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0 18px;
    }

    .section-heading {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 2.6vw, 1.95rem);
      font-weight: 700;
      color: var(--text-main);
    }

    .section-note {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Grid */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .dish-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dish-card:hover {
      border-color: var(--border-gold);
      box-shadow: var(--shadow-elevated);
    }

    .dish-body {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .dish-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(36, 25, 24, 0.1);
    }

    .dish-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.24rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .dish-price {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--accent-burgundy);
      white-space: nowrap;
    }

    .dish-desc {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: var(--text-muted);
      flex: 1;
    }

    .allergen-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .allergen-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-soft);
      color: var(--text-muted);
      border: 1px solid rgba(36, 25, 24, 0.08);
    }

      background: rgba(46, 125, 50, 0.09);
      color:
