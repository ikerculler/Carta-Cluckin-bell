<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Taberna Ibérica — Carta Digital Táctil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #faf7f2;
      --bg-surface: #ffffff;
      --bg-soft: #f3ede2;
      --text-main: #241918;
      --text-muted: #5e4c49;
      --accent-burgundy: #7c1d27;
      --accent-burgundy-dark: #5e131b;
      --accent-burgundy-soft: rgba(124, 29, 39, 0.08);
      --accent-gold: #b88b3a;
      --accent-gold-soft: rgba(184, 139, 58, 0.14);
      --border-subtle: rgba(36, 25, 24, 0.11);
      --border-gold: rgba(184, 139, 58, 0.35);
      --shadow-card: 0 10px 28px rgba(36, 25, 24, 0.06);
      --shadow-elevated: 0 18px 42px rgba(36, 25, 24, 0.14);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 112px;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(184, 139, 58, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(124, 29, 39, 0.06) 0%, transparent 42%);
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 18px 36px;
    }

    /* Header */
    .brand-header {
      text-align: center;
      padding: 14px 16px 22px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .brand-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .brand-eyebrow::before,
    .brand-eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--accent-gold);
      opacity: 0.65;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4.4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent-burgundy);
    }

    .brand-subtitle {
      margin: 8px auto 0;
      max-width: 620px;
      font-size: 14.5px;
      color: var(--text-muted);
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 18px 2px 14px;
      margin-bottom: 6px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(250, 247, 242, 0.96) 78%, rgba(250, 247, 242, 0));
      backdrop-filter: blur(8px);
    }

    .tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1 0 auto;
      min-height: 52px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 10px rgba(36, 25, 24, 0.04);
      user-select: none;
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn.active {
      background: var(--accent-burgundy);
      border-color: var(--accent-burgundy);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(124, 29, 39, 0.24);
    }

    .tab-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-gold-soft);
      color: var(--accent-burgundy);
    }

    .tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Section Header */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0 18px;
    }

    .section-heading {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 2.6vw, 1.95rem);
      font-weight: 700;
      color: var(--text-main);
    }

    .section-note {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Grid */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .dish-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dish-card:hover {
      border-color: var(--border-gold);
      box-shadow: var(--shadow-elevated);
    }

    .dish-media {
      position: relative;
      height: 176px;
      background: var(--bg-soft);
      cursor: pointer;
      overflow: hidden;
    }

    .dish-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .dish-media:hover img {
      transform: scale(1.04);
    }

    .dish-detail-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(36, 25, 24, 0.78);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .dish-body {
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .dish-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .dish-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .dish-price {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-burgundy);
      white-space: nowrap;
    }

    .dish-desc {
      margin: 0 0 12px;
      font-size: 13.5px;
      color: var(--text-muted);
      flex: 1;
    }

    .allergen-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .allergen-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-soft);
      color: var(--text-muted);
      border: 1px solid rgba(36, 25, 24, 0.08);
    }

    .allergen-chip.none {
      background: rgba(46, 125, 50, 0.09);
      color: #255d29;
      border-color: rgba(46, 125, 50, 0.2);
    }

    /* Touch Controls */
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .info-btn {
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-cream);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .info-btn:active {
      transform: scale(0.97);
      background: var(--bg-soft);
    }

    .add-btn {
      flex: 1;
      min-height: 46px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent-burgundy);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .add-btn:hover {
      background: var(--accent-burgundy-dark);
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .stepper {
      flex: 1;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-burgundy-soft);
      border: 1.5px solid rgba(124, 29, 39, 0.25);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .stepper-btn {
      width: 42px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: var(--accent-burgundy);
      color: #ffffff;
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .stepper-btn:active {
      transform: scale(0.94);
      background: var(--accent-burgundy-dark);
    }

    .stepper-qty {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-burgundy);
      min-width: 28px;
      text-align: center;
    }

    /* Menú del Día */
    .daily-menu-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }

    .daily-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }

    .daily-day-heading {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      font-size: 1.55rem;
      color: var(--accent-burgundy);
    }

    .daily-sub {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .daily-price-box {
      text-align: right;
      background: var(--bg-cream);
      border: 1px solid var(--border-gold);
      padding: 10px 16px;
      border-radius: var(--radius-md);
    }

    .daily-price-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-gold);
    }

    .daily-price-value {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent-burgundy);
    }

    .day-selector-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .day-pill {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-cream);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-pill.active {
      background: var(--accent-burgundy);
      border-color: var(--accent-burgundy);
      color: #ffffff;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .course-box {
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .course-img-wrap {
      height: 138px;
      background: var(--bg-soft);
      cursor: pointer;
    }

    .course-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .course-content {
      padding: 12px 14px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .course-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .course-name {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .course-desc {
      margin: 0 0 8px;
      font-size: 12.8px;
      color: var(--text-muted);
      flex: 1;
    }

    .course-fixed-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
    }

    .drink-choice-panel {
      background: var(--bg-cream);
      border: 1.5px solid rgba(124, 29, 39, 0.18);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 20px;
    }

    .drink-choice-title {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      font-size: 1.18rem;
      color: var(--text-main);
    }

    .drink-choice-hint {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .drink-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }

    .drink-option-btn {
      min-height: 48px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .drink-option-btn.selected {
      border-color: var(--accent-burgundy);
      background: var(--accent-burgundy-soft);
      color: var(--accent-burgundy);
      box-shadow: inset 0 0 0 1px var(--accent-burgundy);
    }

    .daily-footer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .daily-allergen-note {
      font-size: 12.8px;
      color: var(--text-muted);
      max-width: 620px;
    }

    /* Floating Bottom Bar */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(36, 25, 24, 0.96);
      backdrop-filter: blur(10px);
      color: #ffffff;
      border-top: 1px solid rgba(184, 139, 58, 0.35);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.22);
    }

    .bottom-bar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-meta {
      display: flex;
      flex-direction: column;
    }

    .summary-count {
      font-size: 12.5px;
      color: #e6d7be;
      font-weight: 500;
    }

    .summary-total {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }

    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clear-btn {
      min-height: 46px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: transparent;
      color: #f3ede2;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .review-btn {
      min-height: 48px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent-gold);
      color: #1f1412;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .review-btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .review-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .review-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(24, 15, 14, 0.62);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevated);
      border: 1px solid var(--border-gold);
      animation: modalPop 0.18s ease-out;
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-hero {
      position: relative;
      height: 220px;
      background: var(--bg-soft);
    }

    .modal-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: none;
      background: rgba(36, 25, 24, 0.82);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .modal-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--text-main);
    }

    .modal-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-burgundy);
      white-space: nowrap;
    }

    .modal-section-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
      margin: 14px 0 6px;
    }

    .modal-text {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .order-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .order-item-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-soft);
    }

    .order-item-info {
      flex: 1;
      min-width: 0;
    }

    .order-item-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .order-item-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .order-item-subtotal {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent-burgundy);
      white-space: nowrap;
    }

    .modal-footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .secondary-modal-btn {
      flex: 1;
      min-height: 46px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-cream);
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .primary-modal-btn {
      flex: 1.4;
      min-height: 46px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent-burgundy);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .toast-banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      z-index: 80;
      background: var(--accent-burgundy);
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-elevated);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    const TABS = [
      { id: "entrantes", label: "Entrantes", subtitle: "Para compartir y abrir boca" },
      { id: "principales", label: "Principales", subtitle: "Platos fuertes, arroces y asados" },
      { id: "postres", label: "Postres", subtitle: "Dulces tradicionales de la casa" },
      { id: "bebidas", label: "Bebidas", subtitle: "Refrescos, cervezas, cafés y sangría" },
      { id: "vinos", label: "Vinos", subtitle: "Copas de bodega y tintos de verano" },
      { id: "menu-del-dia", label: "Menú del Día", subtitle: "Primero, segundo y postre fijos · Elige solo tu bebida" }
    ];

    const todayJsDay = new Date().getDay();
    const state = {
      activeTab: "entrantes",
      selectedMenuDay: todayJsDay,
      selectedMenuDrinkId: MENU_DRINK_CHOICES[0].id,
      quantities: {}, // itemId -> count
      dailyMenuQty: 0
    };

    function formatEUR(amount) {
      return Number(amount || 0).toFixed(2).replace(".", ",") + " €";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function getAllCatalogItems() {
      return [
        ...CATALOG.entrantes,
        ...CATALOG.principales,
        ...CATALOG.postres,
        ...CATALOG.bebidas,
        ...CATALOG.vinos
      ];
    }

    function findItemById(id) {
      return getAllCatalogItems().find(item => item.id === id) || null;
    }

    function getCurrentDailyMenu() {
      return DAILY_MENUS_BY_DAY[state.selectedMenuDay] || DAILY_MENUS_BY_DAY[1];
    }

    function getSelectedDrinkObj() {
      return MENU_DRINK_CHOICES.find(d => d.id === state.selectedMenuDrinkId) || MENU_DRINK_CHOICES[0];
    }

    function getTotalCount() {
      const singles = Object.values(state.quantities).reduce((acc, q) => acc + (q > 0 ? q : 0), 0);
      return singles + (state.dailyMenuQty > 0 ? state.dailyMenuQty : 0);
    }

    function getTotalAmount() {
      let sum = 0;
      for (const [id, qty] of Object.entries(state.quantities)) {
        if (qty > 0) {
          const item = findItemById(id);
          if (item) sum += item.price * qty;
        }
      }
      if (state.dailyMenuQty > 0) {
        sum += MENU_PRICE * state.dailyMenuQty;
      }
      return sum;
    }

    function updateQty(itemId, delta) {
      const current = state.quantities[itemId] || 0;
      const next = Math.max(0, current + delta);
      if (next === 0) {
        delete state.quantities[itemId];
      } else {
        state.quantities[itemId] = next;
      }
      const item = findItemById(itemId);
      if (delta > 0 && item) {
        showToast(`Añadido: ${item.name} (${next})`);
      }
      render();
    }

    function addDailyMenuToSelection() {
      state.dailyMenuQty += 1;
      const menu = getCurrentDailyMenu();
      const drink = getSelectedDrinkObj();
      showToast(`Menú del Día (${menu.dayName}) · ${drink.name} añadido`);
      render();
    }

    function clearSelection() {
      state.quantities = {};
      state.dailyMenuQty = 0;
      const confirmedBox = document.getElementById("summaryConfirmedBox");
      if (confirmedBox) {
        confirmedBox.style.display = "none";
        confirmedBox.textContent = "";
      }
      showToast("Selección vaciada");
      render();
    }

    function renderTabs() {
      const nav = document.getElementById("tabsNav");
      nav.innerHTML = TABS.map(tab => {
        const isActive = state.activeTab === tab.id;
        let countBadge = 0;
        if (tab.id === "menu-del-dia") {
          countBadge = state.dailyMenuQty;
        } else if (CATALOG[tab.id]) {
          countBadge = CATALOG[tab.id].reduce((acc, it) => acc + (state.quantities[it.id] || 0), 0);
        }
        return `
          <button
            type="button"
            class="tab-btn ${isActive ? "active" : ""}"
            data-tab="${tab.id}"
            aria-pressed="${isActive}"
          >
            <span>${tab.label}</span>
            ${countBadge > 0 ? `<span class="tab-badge">${countBadge}</span>` : ""}
          </button>
        `;
      }).join("");

      nav.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderAllergenChips(allergens) {
      if (!allergens || allergens.length === 0) {
        return `<span class="allergen-chip none">Sin alérgenos declarados</span>`;
      }
      return allergens.map(a => `<span class="allergen-chip">${a}</span>`).join("");
    }

    function renderCatalogSection(tabObj) {
      const items = CATALOG[tabObj.id] || [];
      return `
        <div class="section-header">
          <h2 class="section-heading">${tabObj.label}</h2>
          <p class="section-note">${tabObj.subtitle}</p>
        </div>
        <div class="items-grid">
          ${items.map(item => {
            const qty = state.quantities[item.id] || 0;
            const fallbackSrc = createFallbackPhoto(item.name, "#7c1d27", "#e2b857");
            return `
              <article class="dish-card">
                <div class="dish-media" data-detail-id="${item.id}">
                  <img
                    src="${item.photo}"
                    alt="${item.name}"
                    data-label="${item.name}"
                    loading="lazy"
                    onerror="handlePhotoError(this)"
                  />
                  <span class="dish-detail-pill">Ver detalle</span>
                </div>
                <div class="dish-body">
                  <div class="dish-top">
                    <h3 class="dish-title" data-detail-id="${item.id}">${item.name}</h3>
                    <span class="dish-price">${formatEUR(item.price)}</span>
                  </div>
                  <p class="dish-desc">${item.desc}</p>
                  <div class="allergen-row">
                    ${renderAllergenChips(item.allergens)}
                  </div>
                  <div class="card-actions">
                    <button type="button" class="info-btn" data-detail-id="${item.id}">Ingredientes</button>
                    ${
                      qty > 0
                        ? `
                          <div class="stepper" aria-label="Cantidad de ${item.name}">
                            <button type="button" class="stepper-btn" data-dec-id="${item.id}" aria-label="Restar ${item.name}">&minus;</button>
                            <span class="stepper-qty">${qty}</span>
                            <button type="button" class="stepper-btn" data-inc-id="${item.id}" aria-label="Sumar ${item.name}">+</button>
                          </div>
                        `
                        : `
                          <button type="button" class="add-btn" data-inc-id="${item.id}">+ Añadir</button>
                        `
                    }
                  </div>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderDailyMenuSection(tabObj) {
      const menu = getCurrentDailyMenu();
      const orderedDays = [1, 2, 3, 4, 5, 6, 0];
      const allMenuAllergens = Array.from(new Set([
        ...(menu.primero.allergens || []),
        ...(menu.segundo.allergens || []),
        ...(menu.postre.allergens || []),
        ...(getSelectedDrinkObj().allergens || [])
      ]));

      const renderFixedCourse = (label, key, course) => `
        <div class="course-box">
          <div class="course-img-wrap" data-course-key="${key}">
            <img
              src="${course.photo}"
              alt="${course.name}"
              data-label="${course.name}"
              loading="lazy"
              onerror="handlePhotoError(this)"
            />
          </div>
          <div class="course-content">
            <span class="course-tag">${label}</span>
            <h3 class="course-name">${course.name}</h3>
            <p class="course-desc">${course.desc}</p>
            <span class="course-fixed-tag">Fijo del ${menu.dayName.toLowerCase()}</span>
          </div>
        </div>
      `;

      return `
        <div class="section-header">
          <h2 class="section-heading">${tabObj.label}</h2>
          <p class="section-note">${tabObj.subtitle}</p>
        </div>

        <section class="daily-menu-card" aria-label="Menú del Día">
          <div class="daily-top-bar">
            <div>
              <h3 class="daily-day-heading">Menú del ${menu.dayName}</h3>
              <p class="daily-sub">Primero, segundo y postre ya establecidos para hoy. Selecciona únicamente la bebida incluida.</p>
            </div>
            <div class="daily-price-box">
              <span class="daily-price-label">Precio cerrado</span>
              <span class="daily-price-value">${formatEUR(MENU_PRICE)}</span>
            </div>
          </div>

          <div class="day-selector-strip" role="group" aria-label="Día de la semana del menú">
            ${orderedDays.map(d => {
              const label = DAILY_MENUS_BY_DAY[d].dayName;
              const isToday = d === todayJsDay;
              const isSelected = d === state.selectedMenuDay;
              return `
                <button
                  type="button"
                  class="day-pill ${isSelected ? "active" : ""}"
                  data-menu-day="${d}"
                >${label}${isToday ? " · Hoy" : ""}</button>
              `;
            }).join("")}
          </div>

          <div class="courses-grid">
            ${renderFixedCourse("Primero", "primero", menu.primero)}
            ${renderFixedCourse("Segundo", "segundo", menu.segundo)}
            ${renderFixedCourse("Postre", "postre", menu.postre)}
          </div>

          <div class="drink-choice-panel">
            <h4 class="drink-choice-title">Única elección del menú: Bebida o Vino</h4>
            <p class="drink-choice-hint">Bebida elegida actualmente: <strong>${getSelectedDrinkObj().name}</strong></p>
            <div class="drink-options-grid">
              ${MENU_DRINK_CHOICES.map(drink => {
                const active = drink.id === state.selectedMenuDrinkId;
                return `
                  <button
                    type="button"
                    class="drink-option-btn ${active ? "selected" : ""}"
                    data-drink-id="${drink.id}"
                  >
                    <span>${drink.name}</span>
                    <span style="font-size:11px;opacity:0.75;">${active ? "✓" : drink.category}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <div class="daily-footer-actions">
            <div class="daily-allergen-note">
              <strong>Alérgenos del menú seleccionado:</strong>
              ${allMenuAllergens.length ? allMenuAllergens.join(", ") : "Ninguno declarado"}
              ${state.dailyMenuQty > 0 ? ` · <strong>En tu selección: ${state.dailyMenuQty}</strong>` : ""}
            </div>
            <button type="button" class="add-btn" id="addDailyMenuBtn" style="max-width:290px;">
              + Añadir Menú (${formatEUR(MENU_PRICE)})
            </button>
          </div>
        </section>
      `;
    }

    function renderBottomBar() {
      const count = getTotalCount();
      const total = getTotalAmount();
      const countEl = document.getElementById("summaryCount");
      const totalEl = document.getElementById("summaryTotal");
      const clearBtn = document.getElementById("clearSelectionBtn");
      const reviewBtn = document.getElementById("openSummaryBtn");

      countEl.textContent = count === 1 ? "1 elemento seleccionado" : `${count} elementos seleccionados`;
      totalEl.textContent = formatEUR(total);
      clearBtn.disabled = count === 0;
      reviewBtn.disabled = count === 0;
    }

    function bindCardEvents() {
      document.querySelectorAll("[data-inc-id]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          updateQty(btn.dataset.incId, 1);
        });
      });

      document.querySelectorAll("[data-dec-id]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          updateQty(btn.dataset.decId, -1);
        });
      });

      document.querySelectorAll("[data-detail-id]").forEach(el => {
        el.addEventListener("click", e => {
          e.stopPropagation();
          openItemDetailModal(el.dataset.detailId);
        });
      });

      document.querySelectorAll("[data-menu-day]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedMenuDay = Number(btn.dataset.menuDay);
          render();
        });
      });

      document.querySelectorAll("[data-drink-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedMenuDrinkId = btn.dataset.drinkId;
          render();
        });
      });

      document.querySelectorAll("[data-course-key]").forEach(el => {
        el.addEventListener("click", () => {
          const menu = getCurrentDailyMenu();
          const course = menu[el.dataset.courseKey];
          if (!course) return;
          openCustomDetailModal({
            title: course.name,
            priceText: "Incluido en Menú del Día",
            desc: course.desc,
            ingredients: course.ingredients,
            allergens: course.allergens,
            photo: course.photo,
            actionHtml: `<button type="button" class="primary-modal-btn" id="modalAddMenuBtn">Añadir Menú del Día (${formatEUR(MENU_PRICE)})</button>`
          });
          const addBtn = document.getElementById("modalAddMenuBtn");
          if (addBtn) {
            addBtn.addEventListener("click", () => {
              addDailyMenuToSelection();
              closeDetailModal();
            });
          }
        });
      });

      const addMenuBtn = document.getElementById("addDailyMenuBtn");
      if (addMenuBtn) {
        addMenuBtn.addEventListener("click", addDailyMenuToSelection);
      }
    }

    function openCustomDetailModal({ title, priceText, desc, ingredients, allergens, photo, actionHtml }) {
      const img = document.getElementById("detailImg");
      img.dataset.fallbackApplied = "0";
      img.dataset.label = title;
      img.alt = title;
      img.src = photo;

      document.getElementById("detailTitle").textContent = title;
      document.getElementById("detailPrice").textContent = priceText;
      document.getElementById("detailDesc").textContent = desc;
      document.getElementById("detailIngredients").textContent = ingredients;
      document.getElementById("detailAllergens").innerHTML = renderAllergenChips(allergens);
      document.getElementById("detailActionSlot").innerHTML = actionHtml || "";

      document.getElementById("detailModal").classList.add("open");
    }

    function openItemDetailModal(itemId) {
      const item = findItemById(itemId);
      if (!item) return;
      const qty = state.quantities[item.id] || 0;

      openCustomDetailModal({
        title: item.name,
        priceText: formatEUR(item.price),
        desc: item.desc,
        ingredients: item.ingredients,
        allergens: item.allergens,
        photo: item.photo,
        actionHtml: qty > 0
          ? `
            <div class="stepper" style="max-width:190px;">
              <button type="button" class="stepper-btn" id="modalDecBtn">&minus;</button>
              <span class="stepper-qty" id="modalQtyLabel">${qty}</span>
              <button type="button" class="stepper-btn" id="modalIncBtn">+</button>
            </div>
            <button type="button" class="primary-modal-btn" id="modalDoneBtn">Listo</button>
          `
          : `<button type="button" class="primary-modal-btn" id="modalAddSingleBtn">+ Añadir por ${formatEUR(item.price)}</button>`
      });

      const addBtn = document.getElementById("modalAddSingleBtn");
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          updateQty(item.id, 1);
          openItemDetailModal(item.id);
        });
      }

      const incBtn = document.getElementById("modalIncBtn");
      const decBtn = document.getElementById("modalDecBtn");
      const doneBtn = document.getElementById("modalDoneBtn");

      if (incBtn) {
        incBtn.addEventListener("click", () => {
          updateQty(item.id, 1);
          openItemDetailModal(item.id);
        });
      }
      if (decBtn) {
        decBtn.addEventListener("click", () => {
          updateQty(item.id, -1);
          if ((state.quantities[item.id] || 0) === 0) {
            closeDetailModal();
          } else {
            openItemDetailModal(item.id);
          }
        });
      }
      if (doneBtn) {
        doneBtn.addEventListener("click", closeDetailModal);
      }
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function openSummaryModal() {
      const listEl = document.getElementById("summaryItemsList");
      const confirmedBox = document.getElementById("summaryConfirmedBox");
      confirmedBox.style.display = "none";
      confirmedBox.textContent = "";

      const rows = [];

      if (state.dailyMenuQty > 0) {
        const menu = getCurrentDailyMenu();
        const drink = getSelectedDrinkObj();
        const subtotal = MENU_PRICE * state.dailyMenuQty;
        rows.push(`
          <div class="order-item-row">
            <img class="order-item-thumb" src="${menu.segundo.photo}" alt="${menu.dayName}" onerror="handlePhotoError(this)" />
            <div class="order-item-info">
              <div class="order-item-name">Menú del Día (${menu.dayName}) &times; ${state.dailyMenuQty}</div>
              <div class="order-item-sub">${menu.primero.name} · ${menu.segundo.name} · ${menu.postre.name} · <strong>Bebida: ${drink.name}</strong></div>
            </div>
            <div class="order-item-subtotal">${formatEUR(subtotal)}</div>
          </div>
        `);
      }

      for (const [id, qty] of Object.entries(state.quantities)) {
        if (qty <= 0) continue;
        const item = findItemById(id);
        if (!item) continue;
        rows.push(`
          <div class="order-item-row">
            <img class="order-item-thumb" src="${item.photo}" alt="${item.name}" onerror="handlePhotoError(this)" />
            <div class="order-item-info">
              <div class="order-item-name">${item.name} &times; ${qty}</div>
              <div class="order-item-sub">${formatEUR(item.price)} c/u</div>
            </div>
            <div class="order-item-subtotal">${formatEUR(item.price * qty)}</div>
          </div>
        `);
      }

      if (rows.length === 0) {
        listEl.innerHTML = `<p class="modal-text" style="padding:14px 0;">No hay elementos seleccionados todavía.</p>`;
      } else {
        listEl.innerHTML = rows.join("") + `
          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;font-weight:700;font-size:1.1rem;color:var(--accent-burgundy);">
            <span>Total estimado</span>
            <span>${formatEUR(getTotalAmount())}</span>
          </div>
        `;
      }

      document.getElementById("summaryModal").classList.add("open");
    }

    function closeSummaryModal() {
      document.getElementById("summaryModal").classList.remove("open");
    }

    function render() {
      renderTabs();
      const container = document.getElementById("menuContainer");
      const currentTabObj = TABS.find(t => t.id === state.activeTab) || TABS[0];

      if (currentTabObj.id === "menu-del-dia") {
        container.innerHTML = renderDailyMenuSection(currentTabObj);
      } else {
        container.innerHTML = renderCatalogSection(currentTabObj);
      }

      bindCardEvents();
      renderBottomBar();
    }

    document.getElementById("closeDetailBtn").addEventListener("click", closeDetailModal);
    document.getElementById("detailModal").addEventListener("click", e => {
      if (e.target.id === "detailModal") closeDetailModal();
    });

    document.getElementById("openSummaryBtn").addEventListener("click", openSummaryModal);
    document.getElementById("closeSummaryBtn").addEventListener("click", closeSummaryModal);
    document.getElementById("summaryModal").addEventListener("click", e => {
      if (e.target.id === "summaryModal") closeSummaryModal();
    });

    document.getElementById("clearSelectionBtn").addEventListener("click", clearSelection);
    document.getElementById("summaryClearBtn").addEventListener("click", () => {
      clearSelection();
      openSummaryModal();
    });

    document.getElementById("confirmOrderBtn").addEventListener("click", () => {
      if (getTotalCount() === 0) return;
      const box = document.getElementById("summaryConfirmedBox");
      box.style.display = "block";
      box.textContent = `Selección registrada (${formatEUR(getTotalAmount())}). Muestra este resumen en barra o mesa para preparar tu comanda.`;
      showToast("Comanda lista para mostrar en mesa");
    });

    render();
  </script>
</body>
</html>
